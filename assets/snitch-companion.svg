<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#8A6721" />
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vertical Winding Flight Trajectory down the page -->
    <path id="vertical-flight" d="M 100,20 Q 180,120 120,220 Q 30,320 150,400 Q 180,480 100,560 Q 20,460 70,360 Q 170,260 90,160 Z" fill="none" />
  </defs>

  <style>
    @keyframes wing-beat {
      0%, 100% { transform: scaleY(1) rotate(-15deg); }
      50% { transform: scaleY(0.2) rotate(25deg); }
    }
    .wing-l { transform-origin: 0px 0px; animation: wing-beat 0.16s ease-in-out infinite; }
    .wing-r { transform-origin: 0px 0px; animation: wing-beat 0.16s ease-in-out infinite reverse; }

    @keyframes trail-fade {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.6; }
    }
    .flight-trail { stroke-dasharray: 4, 8; animation: trail-fade 2s ease-in-out infinite; }
  </style>

  <!-- Golden Orbit Wake Trail -->
  <use href="#vertical-flight" stroke="url(#gold)" stroke-width="1.2" opacity="0.3" class="flight-trail" filter="url(#glow)"/>

  <!-- The Snitch in Vertical Flight Following the User's Scroll -->
  <g>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
      <mpath href="#vertical-flight" />
    </animateMotion>

    <!-- Dropped Golden Stardust -->
    <circle cx="-12" cy="0" r="2" fill="#FFE082" opacity="0.8" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;0.5" dur="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="-22" cy="2" r="1.5" fill="#C5A059" opacity="0.6" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;0" dur="0.8s" repeatCount="indefinite" />
    </circle>

    <!-- Left Wing -->
    <path class="wing-l" d="M 0,0 C -25,-28 -45,-12 -60,-20 C -40,-6 -20,-10 0,0 Z" fill="url(#gold)" opacity="0.85" />

    <!-- Right Wing -->
    <path class="wing-r" d="M 0,0 C -25,28 -45,12 -60,20 C -40,6 -20,10 0,0 Z" fill="url(#gold)" opacity="0.85" />

    <!-- Glowing Core Sphere -->
    <circle cx="0" cy="0" r="9" fill="url(#gold)" filter="url(#glow)"/>
    <circle cx="-2" cy="-2" r="2.5" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>
